[build-system]
requires = [
    "hatchling",
    "hatch-jupyter-builder>=0.5.0",
]
build-backend = "hatchling.build"

[project]
name = "revisitpy"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = [
    "anywidget",
    "pydantic>=2.10.5",
    "pandas",
]
readme = "README.md"

# For projects not using `uv`, you can install these development dependencies with:
# `pip install -e ".[dev]"`
# If you're using `uv` for development, feel free to remove this section.
[project.optional-dependencies]
dev = ["watchfiles", "jupyterlab"]

# Dependency groups (recognized by `uv`). For more details, visit:
# https://peps.python.org/pep-0735/
[dependency-groups]
dev = ["watchfiles", "jupyterlab"]
release = ["datamodel-code-generator[black,isort]==0.89.0", "hatch>=1.18.2"]

[tool.datamodel-codegen]
input = "src/revisitpy/StudyConfigSchema.json"
output = "src/revisitpy/models.py"
input-file-type = "jsonschema"
custom-template-dir = "custom_templates"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
additional-imports = "typing.TypedDict, warnings"
formatters = ["black", "isort"]
# Preserve the public schema field without stripping safe prefixes from enums.
aliases = '{"$schema": "schema"}'


[tool.hatch.build]
only-packages = true
artifacts = ["src/revisitpy/static/*"]
exclude = ["tests", "scripts"]


[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["src/revisitpy/static/widget.js"]
skip-if-exists = ["src/revisitpy/static/widget.js"]
dependencies = ["hatch-jupyter-builder>=0.5.0"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = "yarn"
build_cmd = "build"
