name: Create a new minor version and push to PyPi and GitHub

on:
  repository_dispatch:
    types: [study_repo_publish]
  workflow_dispatch:

jobs:
  create_version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - uses: actions/checkout@v4
        with:
          repository: revisit-studies/study
          path: study

      - name: Copy new study docs to docs and cleanup
        run: |
          cp study/src/parser/StudyConfigSchema.json src/revisitpy/

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install locked release dependencies
        run: uv sync --locked --group release

      - name: Run CodeGen
        run: |
          uv run --no-sync datamodel-codegen

      - name: Test generated models
        run: uv run --no-sync python -m unittest discover -s tests

      - name: Update pyproject.toml version
        run: |
          # Extract the current version
          MAJOR_VERSION=$(sed -nE 's/^version = "([0-9]+)\.[0-9]+\.[0-9]+"/\1/p' pyproject.toml)
          MINOR_VERSION=$(sed -nE 's/^version = "[0-9]+\.([0-9]+)\.[0-9]+"/\1/p' pyproject.toml)

          # Increment the minor version
          NEW_MINOR_VERSION=$((MINOR_VERSION + 1))
          NEW_VERSION="${MAJOR_VERSION}.${NEW_MINOR_VERSION}.0"

          # Update the version in pyproject.toml
          sed -i -E 's/^version = "[0-9]+\.[0-9]+\.[0-9]+"/version = "'"${NEW_VERSION}"'"/' pyproject.toml

          # Print the new version for debugging
          echo "New version: ${NEW_VERSION}"

      - name: Update lockfile version
        run: uv lock

      - name: Commit and push changes
        run: |
          git config --global user.email "jackwilburn@tutanota.com"
          git config --global user.name "Jack Wilburn"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Create a new version based on the latest tag"
          else
            echo "No changes to commit"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Hatch Build
        run: |
          uv run --no-sync hatch build

      # - name: Hatch Build
      #   run: |
      #     uv hatch publish

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
