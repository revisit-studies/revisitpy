name: Create a new version and push to PyPI and GitHub

on:
  repository_dispatch:
    types: [study_repo_publish]
  workflow_dispatch:
    inputs:
      study_tag:
        description: "Released study tag (vX.Y.Z); supplies schema and package major/minor"
        required: true
        type: string
      release_version:
        description: "Optional exact X.Y.Z package version; major/minor must match study_tag"
        required: false
        type: string

concurrency:
  group: revisitpy-publish
  cancel-in-progress: false

jobs:
  create_version:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAT }}

      - name: Resolve study release tag
        env:
          STUDY_TAG: ${{ github.event.client_payload.release_tag || inputs.study_tag }}
        run: |
          [[ "$STUDY_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "A release_tag / study_tag in vX.Y.Z form is required"; exit 1; }
          echo "STUDY_TAG=$STUDY_TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: revisit-studies/study
          ref: refs/tags/${{ env.STUDY_TAG }}
          path: study

      - name: Copy new study docs to docs and cleanup
        run: |
          cp study/src/parser/StudyConfigSchema.json src/revisitpy/

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install locked release dependencies
        run: uv sync --locked --group release

      - name: Run CodeGen
        run: |
          uv run --no-sync datamodel-codegen

      - name: Test generated models
        run: uv run --no-sync python -m unittest discover -s tests

      - name: Update pyproject.toml version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: uv run --no-sync python scripts/set_release_version.py --bump patch --study-tag "$STUDY_TAG" --version "$RELEASE_VERSION"

      - name: Update lockfile version
        run: uv lock

      - name: Build and verify release artifacts
        run: |
          uv run --no-sync hatch build
          uv run --no-sync python - <<'PYTHON'
          import email
          from pathlib import Path
          import tarfile
          import tomllib
          import zipfile

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          wheel = Path(f"dist/revisitpy-{version}-py3-none-any.whl")
          sdist = Path(f"dist/revisitpy-{version}.tar.gz")
          if set(Path("dist").iterdir()) != {wheel, sdist}:
              raise SystemExit("Unexpected release artifacts; refusing to publish")
          with zipfile.ZipFile(wheel) as archive:
              metadata = archive.read(f"revisitpy-{version}.dist-info/METADATA").decode()
          with tarfile.open(sdist) as archive:
              package_info = archive.extractfile(f"revisitpy-{version}/PKG-INFO").read().decode()
          for text in (metadata, package_info):
              headers = email.message_from_string(text)
              if headers["Name"] != "revisitpy" or headers["Version"] != version:
                  raise SystemExit("Artifact metadata does not match the requested release")
          print(f"Verified wheel and sdist for revisitpy {version}")
          PYTHON

      - name: Commit and push changes
        run: |
          git config --global user.email "jackwilburn@tutanota.com"
          git config --global user.name "Jack Wilburn"
          git add pyproject.toml uv.lock src/revisitpy/StudyConfigSchema.json src/revisitpy/models.py
          if ! git diff --cached --quiet; then
            git commit -m "Create a new version based on the latest tag"
          else
            echo "No changes to commit"
          fi
          # Fail before publishing if main moved while these artifacts were built.
          git push origin HEAD:main

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
